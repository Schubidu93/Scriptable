name: Leichtathletik Woche

# Täglich von World Athletics: Top-Leistungen der Woche, Rekorde und Bestleistungen, Wettkampfkalender
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/leichtathletik_woche.mjs"
      - "scripts/leichtathletik_rekorde.mjs"
      - "scripts/wa_toplists.mjs"
      - "scripts/leichtathletik_kalender.mjs"
      - ".github/workflows/leichtathletik.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toplisten durchsuchen
        run: node scripts/leichtathletik_woche.mjs
        env:
          DEBUG: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
      - name: Rekorde und Bestleistungen suchen
        run: node scripts/leichtathletik_rekorde.mjs
        continue-on-error: true
      - name: Wettkampfkalender laden
        run: node scripts/leichtathletik_kalender.mjs
        continue-on-error: true
      - name: Ergebnis speichern
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leichtathletik_*.json
          git diff --staged --quiet || (git commit -m "Leichtathletik: Daten aktualisiert" && git pull --rebase && git push)
