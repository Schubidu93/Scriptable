name: Gipfel OSM

# Wöchentlich die OpenStreetMap-Gipfel für Süddeutschland laden (data/gipfel/*.json für Gipfel.js)
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/osm_gipfel.mjs"
      - ".github/workflows/gipfel.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gipfel laden
        run: node scripts/osm_gipfel.mjs
      - name: Ergebnis speichern
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gipfel
          git diff --staged --quiet || (git commit -m "Gipfel: OpenStreetMap-Daten aktualisiert" && git pull --rebase && git push)
