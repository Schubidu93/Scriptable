name: Kalender-Test
on:
  push:
    branches: [wa-kalender]
    paths: ["scripts/wa_kalender_probe.mjs"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wa_kalender_probe.mjs
