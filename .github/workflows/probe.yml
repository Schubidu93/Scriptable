name: Probe
on:
  push:
    branches: [probe-*]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: biathlonlab Rennseite
        run: |
          UA="Scriptable-Biathlon-Widget/1.0 (github.com/Schubidu93/Scriptable)"
          for p in /de/about /de/imprint /de/races /de/race/BT2627SWRLCP01SMIN; do
            echo "=================== $p"
            curl -sSL -m 30 -A "$UA" -o q.html -w "HTTP %{http_code}\n" "https://biathlonlab.com$p"
            python3 - "$p" <<'PY'
          import re,html,sys
          t=open('q.html',encoding='utf-8',errors='replace').read()
          x=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>',' ',t))))
          p=sys.argv[1]
          if p in ('/de/about','/de/imprint'):
              print(x[:3000])
          elif p=='/de/races':
              print("Rennlinks:",sorted(set(re.findall(r'href="(/de/race/[^"]+)"',t)))[:40])
              print(x[:2500])
          else:
              print("Länge",len(t))
              tabs=re.findall(r"<table[\s\S]*?</table>",t); print("Tabellen",len(tabs))
              if tabs: print(tabs[0][:3000])
              print(x[:2500])
          PY
          done
