name: Probe
on:
  push:
    branches: [probe-*]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wikipedia Biathlon
        run: |
          UA="Scriptable-Biathlon-Widget/1.0 (github.com/Schubidu93/Scriptable)"
          for t in "Biathlon-Weltcup_2025/26" "Biathlon-Weltcup_2026/27"; do
            echo "=================== $t"
            curl -sS -A "$UA" "https://de.wikipedia.org/w/api.php?action=parse&page=$t&prop=wikitext&format=json&formatversion=2" -o w.json
            python3 - <<'PY'
          import json,re
          t=json.load(open("w.json"))["parse"]["wikitext"]
          print("Abschnitte:",re.findall(r"^=+[^=\n]+=+",t,re.M))
          for h in ["=== Resultate und Kalender ===","=== Weltcupstände Männer ===","==== Gesamtweltcupführende ===="]:
              j=t.find(h)
              print("#####",h,j)
              if j>=0: print(t[j:j+4500])
          PY
          done
