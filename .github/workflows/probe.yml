name: Probe
on:
  push:
    branches: [probe-*]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: biathlonlab Saisonliste
        run: |
          UA="Scriptable-Biathlon-Widget/1.0 (github.com/Schubidu93/Scriptable)"
          curl -sSL -m 30 -A "$UA" -o r.html "https://biathlonlab.com/de/races"
          python3 - <<'PY'
          import re,html
          t=open('r.html',encoding='utf-8').read()
          for m in re.finditer(r'<a\b[^>]*href="([^"]+)"[^>]*>([\s\S]*?)</a>',t):
              x=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',m.group(2)))).strip()
              if re.match(r'^\d{4}/\d{2}$',x): print("SAISON",x,m.group(1))
          PY
          curl -sSL -m 30 -A "$UA" -o s.html "https://biathlonlab.com/de/races/2526" -w "2526: %{http_code}\n"
          python3 - <<'PY'
          import re,html
          t=open('s.html',encoding='utf-8').read()
          links=list(re.finditer(r'<a\b[^>]*href="(/de/race/[^"]+)"[^>]*>([\s\S]*?)</a>',t))
          print("Links",len(links))
          for m in links[:3]+links[-3:]:
              x=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',m.group(2)))).strip()
              print(m.group(1),"|",x)
          i=links[-1].start()
          print("UMFELD", re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' | ',t[i-2500:i+600]))))
          PY
