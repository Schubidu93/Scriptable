name: Probe
on:
  push:
    branches: [probe-*]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wikipedia Stationsseiten
        run: |
          UA="Scriptable-Biathlon-Widget/1.0 (github.com/Schubidu93/Scriptable)"
          for t in "Biathlon-Weltcup_in_Oslo_2025/26" "Biathlon-Weltcup_in_Kontiolahti_2026/27"; do
            echo "=================== $t"
            curl -sS -A "$UA" "https://de.wikipedia.org/w/api.php?action=parse&page=$t&prop=wikitext&format=json&formatversion=2" -o w.json
            python3 - <<'PY'
          import json,re
          d=json.load(open("w.json"))
          if "error" in d: print(d["error"]); raise SystemExit
          t=d["parse"]["wikitext"]
          print("Länge",len(t))
          print("Abschnitte:",re.findall(r"^=+[^=\n]+=+",t,re.M)[:40])
          j=t.find("Sprint")
          for h in re.finditer(r"^=+[^=\n]*(Sprint|Einzel)[^=\n]*=+",t,re.M):
              print("#####",h.group(0)); print(t[h.start():h.start()+3500]); break
          PY
          done
