name: Probe
on:
  push:
    branches: [probe-*]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: biathlonlab Tabelle
        run: |
          UA="Scriptable-Biathlon-Widget/1.0 (github.com/Schubidu93/Scriptable)"
          curl -sSL -m 30 -A "$UA" -o q.html "https://biathlonlab.com/de/race/BT2627SWRLCP01SMIN"
          python3 - <<'PY'
          import re,html
          t=open('q.html',encoding='utf-8').read()
          tabs=re.findall(r"<table[\s\S]*?</table>",t)
          for i,tb in enumerate(tabs):
              rows=re.findall(r"<tr[\s\S]*?</tr>",tb)
              print("Tabelle",i,"Zeilen",len(rows))
              for r in rows[:16]:
                  x=re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',r))).strip()
                  print(" |",x[:200])
          print("GER-Vorkommen",len(re.findall(r'GER',t)))
          for m in list(re.finditer(r'Horn',t))[:3]:
              print("CTX",t[max(0,m.start()-700):m.start()+300].replace('\n',' '))
          print("Zeit-Muster",re.findall(r'\+\d+:\d\d,\d',t)[:30])
          PY
