name: Biathlon

# Stündlich den Biathlon-Weltcup aus der deutschen Wikipedia laden (data/biathlon.json für Biathlon.js) –
# die IBU-Schnittstelle verlangt seit November 2026 eine Anmeldung
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - "scripts/biathlon_wiki.mjs"
      - ".github/workflows/biathlon.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wikipedia lesen
        run: node scripts/biathlon_wiki.mjs
      - name: Ergebnis speichern
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/biathlon.json
          git diff --staged --quiet -I '"generated"' || (git commit -m "Biathlon: Daten aktualisiert" && git pull --rebase && git push)
